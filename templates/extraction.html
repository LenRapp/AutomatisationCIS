{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4>📄 Extraction de Règles CIS (PDF)</h4>
            </div>
            <div class="card-body">
                <form id="uploadForm">
                    <div class="mb-3">
                        <label for="file" class="form-label">Choisissez un fichier PDF CIS Benchmark</label>
                        <input class="form-control" type="file" id="file" name="file" accept=".pdf" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="btnSubmit">
                        Démarrer l'extraction
                    </button>
                </form>

                <!-- Zone de progression (cachée au début) -->
                <div id="progressArea" class="mt-4" style="display:none;">
                    <h5>Analyse en cours...</h5>
                    <div class="progress" style="height: 25px;">
                        <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" 
                             role="progressbar" style="width: 0%;">0%</div>
                    </div>
                    <p id="statusText" class="text-muted mt-2">Initialisation...</p>
                </div>

                <div id="errorArea" class="alert alert-danger mt-3" style="display:none;"></div>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
$(document).ready(function() {
    $('#uploadForm').on('submit', function(e) {
        e.preventDefault();
        
        var formData = new FormData(this);
        
        // UI Reset
        $('#btnSubmit').prop('disabled', true);
        $('#progressArea').show();
        $('#progressBar').css('width', '0%').text('0%');
        $('#errorArea').hide();

        $.ajax({
            url: '/api/extract',
            type: 'POST',
            data: formData,
            contentType: false,
            processData: false,
            success: function(response) {
                var taskId = response.task_id;
                pollProgress(taskId);
            },
            error: function(err) {
                $('#errorArea').text("Erreur lors de l'envoi du fichier.").show();
                $('#btnSubmit').prop('disabled', false);
                $('#progressArea').hide();
            }
        });
    });

    function pollProgress(taskId) {
        var interval = setInterval(function() {
            $.get('/api/progress/' + taskId, function(data) {
                if (data.status === 'not_found') {
                    clearInterval(interval);
                    $('#errorArea').text("Tâche introuvable.").show();
                    return;
                }
                
                if (data.error) {
                    clearInterval(interval);
                    $('#progressBar').addClass('bg-danger');
                    $('#statusText').text("Erreur : " + data.error);
                    return;
                }

                var p = data.progress;
                $('#progressBar').css('width', p + '%').text(p + '%');
                $('#statusText').text("Traitement de la page... " + p + "%");

                if (data.redirect) {
                    clearInterval(interval);
                    $('#statusText').text("Terminé ! Redirection...");
                    setTimeout(function() {
                        window.location.href = data.redirect;
                    }, 500);
                }
            });
        }, 1000); // Check toutes les 1s
    }
});
</script>
{% endblock %}
